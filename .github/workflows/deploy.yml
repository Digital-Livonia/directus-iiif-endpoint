name: Deploy

# Branch-driven deploy:
#   push to `development` -> DEV   (S3 prefix extensions-dev/, dev-dl-directus-deployment)
#   push to `master`      -> PROD  (S3 prefix extensions/,     dl-directus-deployment)
# Both environments load extensions from the `tu` S3 storage (bucket dl-tlu-ee).
# `workflow_dispatch` stays available to redeploy either environment by hand.
#
# Required repo (or org) secrets:
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY  - the tu-s3-credentials k8s secret
#   KUBERNETES_SA_TOKEN  - the dl-tlu-ee `github-actions` SA token (same value as
#                          dl-app's KUBERNETES_GITHUB_ACTIONS_SA_TOKEN); only
#                          needs deployments patch (rollout restart).

on:
  push:
    branches: [master, development]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [dev, prod]

env:
  EXT_NAME: directus-iiif-endpoint
  KUBE_SERVER: https://kubernetes.hpc.ut.ee:6443
  KUBE_NAMESPACE: dl-tlu-ee
  S3_ENDPOINT: https://s3.hpc.ut.ee
  S3_BUCKET: dl-tlu-ee

jobs:
  deploy:
    runs-on: ubuntu-latest
    # push to master -> prod; push to development, or a manual run, -> the chosen env
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'master' && 'prod' || 'dev') }}
    env:
      TARGET: ${{ github.event.inputs.environment || (github.ref_name == 'master' && 'prod' || 'dev') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package  # → dist/{build/, package.json, README.md}

      - name: Resolve target
        run: |
          if [ "$TARGET" = "prod" ]; then
            echo "S3_PREFIX=extensions"                >> "$GITHUB_ENV"
            echo "DEPLOYMENT=dl-directus-deployment"    >> "$GITHUB_ENV"
            echo "POD_LABEL=app=dl-directus"            >> "$GITHUB_ENV"
          else
            echo "S3_PREFIX=extensions-dev"             >> "$GITHUB_ENV"
            echo "DEPLOYMENT=dev-dl-directus-deployment" >> "$GITHUB_ENV"
            echo "POD_LABEL=app=dev-dl-directus"        >> "$GITHUB_ENV"
          fi
          echo "Deploying $EXT_NAME to $TARGET"

      - name: Strip AppleDouble junk
        run: find dist -name '._*' -delete

      - name: Sync to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws --endpoint-url "$S3_ENDPOINT" s3 sync dist/ \
            "s3://$S3_BUCKET/$S3_PREFIX/$EXT_NAME/" --delete
          echo "synced to s3://$S3_BUCKET/$S3_PREFIX/$EXT_NAME/"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Restart Directus
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - cluster: { server: ${{ env.KUBE_SERVER }}, insecure-skip-tls-verify: true }
            name: c
          contexts:
          - context: { cluster: c, namespace: ${{ env.KUBE_NAMESPACE }}, user: u }
            name: ctx
          current-context: ctx
          users:
          - name: u
            user: { token: ${{ secrets.KUBERNETES_SA_TOKEN }} }
          EOF
          kubectl -n "$KUBE_NAMESPACE" rollout restart "deployment/$DEPLOYMENT"
          kubectl -n "$KUBE_NAMESPACE" rollout status  "deployment/$DEPLOYMENT" --timeout=180s

      # Best-effort log peek. The github-actions SA can rollout-restart but
      # can't list pods, so this must not fail the deploy — `rollout status`
      # above already confirmed the new pod came up healthy.
      - name: Check the extension loaded (best effort)
        continue-on-error: true
        run: |
          POD=$(kubectl -n "$KUBE_NAMESPACE" get pods -l "$POD_LABEL" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          [ -n "$POD" ] && kubectl -n "$KUBE_NAMESPACE" logs "$POD" --tail=40 | grep -iE "extension|iiif|error" || echo "(pod log not accessible — see rollout status above)"
